# Keeps the SHA-pinned actions and the pinned Python dev/ast dependencies
# current. Pinning without an update feed is how pins rot into liabilities;
# this is the feed. Grouped weekly so updates arrive as one reviewable PR
# per ecosystem, which then passes through the same CI and constitution
# gate as any other change.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    groups:
      python-deps:
        patterns: ["*"]
    ignore:
      # The tree-sitter pins are a verified ABI compatibility matrix, not
      # freshness debt: py-tree-sitter 0.23.x rejects grammar ABI 15, which
      # newer grammar wheels ship (rationale in pyproject.toml; PR #2 proved
      # it - every [ast] CI leg failed on the proposed widening). These move
      # only by hand, re-verified against the interpreter floor.
      - dependency-name: "tree-sitter"
      - dependency-name: "tree-sitter-*"
