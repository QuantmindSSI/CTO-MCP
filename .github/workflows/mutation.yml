name: Mutation testing

# Nightly adversarial measurement of the detector core's test suite:
# mutmut mutates scanner/logic/diff/engine code and counts how many
# mutants the tests kill. This is a measurement job, not a merge gate -
# hundreds of mutants times the suite belongs in a budgeted schedule,
# and the score's job is to expose weak tests before they hide a
# detection regression. Configuration lives in [tool.mutmut] in
# pyproject.toml; the kill-rate baseline recorded there is the number to
# beat, and survivors listed in the log are the concrete test gaps.

on:
  schedule:
    - cron: "17 3 * * *" # nightly, off the top-of-hour thundering herd
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mutate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the package and the pinned mutation toolchain
        # mutmut drives pytest; pytest collects the stdlib unittest suite
        # natively, so no test rewrite is involved. Pinned like every other
        # checker: an upstream release must not redefine the measurement.
        run: pip install --disable-pip-version-check ".[ast]" "mutmut==3.3.1" "pytest==8.4.2"
      - name: Run mutation testing over the detector core
        run: mutmut run
      - name: Report the outcome per mutant
        run: |
          mutmut results
          echo "----------------------------------------"
          echo "Surviving mutants (test gaps to close):"
          mutmut results | grep -c "survived" || true
