name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Least privilege: nothing here writes to the repository.
permissions:
  contents: read

# A newer push to the same ref makes the in-flight run irrelevant.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to full commit SHAs, not tags: a tag is a mutable
# pointer under someone else's control, a SHA is content-addressed. The
# trailing comment records the tag each SHA was resolved from; Dependabot
# keeps them current.

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install ruff at the pinned version
        run: pip install --disable-pip-version-check "ruff==0.16.3"
      - run: ruff check .
      - run: ruff format --check .

  types:
    # mypy --strict over the first-party package (configured in pyproject:
    # 3.9 target, vendored codebase_csi outside the regime). Pinned for the
    # same reason ruff is: a checker release must not redden an unchanged
    # commit.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the package and the pinned mypy
        run: pip install --disable-pip-version-check ".[ast]" "mypy==1.19.1"
      - run: mypy

  test:
    runs-on: ubuntu-latest
    strategy:
      # Report every failing interpreter, not just the first.
      fail-fast: false
      matrix:
        # The floor and the ceiling of the range declared in requires-python.
        # 3.9 is here to keep that claim honest rather than aspirational.
        python-version: ["3.9", "3.14"]
        # Both scanner configurations are supported and both are enforced:
        # without the extra the tree-sitter tier must degrade cleanly, with it
        # the xast engine must hit its higher benchmark baseline.
        extras: ["", "[ast]"]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install the package and its dependencies
        run: pip install --disable-pip-version-check ".${{ matrix.extras }}"
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
      - name: Scanner accuracy benchmark
        # Exits non-zero if the union detection rate regresses below the
        # baseline for this configuration (37/37 with [ast], 30/37 without).
        run: python tools/benchmark_scanner.py

  # The OS matrix the README implies (developer laptops) is tested, not
  # assumed. Both legs are required checks: Windows served its
  # informational apprenticeship (its first run found and fixed a POSIX
  # execute-bit assumption in the hook-installer test) and has been green
  # since, so it now gates like everything else.
  os-compat:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the package with the ast extra
        run: pip install --disable-pip-version-check ".[ast]"
      - name: Run the test suite
        run: python -m unittest discover -s tests -v
      - name: Scanner accuracy benchmark
        run: python tools/benchmark_scanner.py

  coverage:
    # A measurement with a ratchet, not a vanity target: fail-under only
    # ever rises (raise it when the measured number rises; never lower it).
    # Ratchet history: 87% measured at introduction (floor 86); 88% after
    # the mutation-gap tests (floor 87); 89% after verify_dependencies
    # shipped with its hermetic suite (floor 88). The floor sits one point under the
    # measurement to absorb line-attribution variance across interpreter
    # releases. The scan-budget wall-clock tests self-skip under the
    # tracer, so this job measures correctness paths, not stopwatches.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Install the package, the ast extra, and coverage
        run: pip install --disable-pip-version-check ".[ast]" coverage
      - name: Run the suite under coverage
        run: python -m coverage run --source=persona_constitution -m unittest discover -s tests
      - name: Enforce the coverage floor
        run: python -m coverage report --fail-under=88

  packaging:
    # Guards the defect where the wheel shipped without CONSTITUTION.md and the
    # installed console script could not start. Import-only tests miss this,
    # because in a checkout the data is found via the source tree.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"
      - name: Build the wheel
        run: |
          pip install --disable-pip-version-check build
          python -m build --wheel

      - name: Assert the data files are inside the wheel
        run: |
          python - <<'PY'
          import glob, sys, zipfile
          wheel = glob.glob("dist/*.whl")[0]
          names = zipfile.ZipFile(wheel).namelist()
          required = [
              "persona_constitution/data/CONSTITUTION.md",
              "persona_constitution/data/DIRECTIVES.md",
          ]
          missing = [r for r in required if r not in names]
          if missing:
              sys.exit(f"wheel {wheel} is missing {missing}\ncontents: {names}")
          print(f"OK: {wheel} carries both data files")
          PY

      - name: Install the wheel into a clean venv and run the server from elsewhere
        run: |
          python -m venv /tmp/cleanvenv
          /tmp/cleanvenv/bin/pip install --disable-pip-version-check dist/*.whl
          # cd away from the checkout so the server cannot fall back to source data.
          cd /tmp
          printf '%s\n' \
            '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2024-11-05","capabilities":{},"clientInfo":{"name":"ci","version":"1"}}}' \
            '{"jsonrpc":"2.0","id":2,"method":"tools/call","params":{"name":"get_power_of_10","arguments":{"rule":4}}}' \
            | /tmp/cleanvenv/bin/persona-constitution-mcp > /tmp/out.jsonl 2>/tmp/err.txt || true
          cat /tmp/err.txt
          /tmp/cleanvenv/bin/python - <<'PY'
          import json, sys
          for line in open("/tmp/out.jsonl"):
              line = line.strip()
              if not line:
                  continue
              msg = json.loads(line)
              if msg.get("id") == 2:
                  text = msg["result"]["content"][0]["text"]
                  assert "Rule 4" in text, text[:200]
                  print("OK: installed console script served:", text.splitlines()[0])
                  sys.exit(0)
          sys.exit("installed server produced no response for id=2")
          PY
