[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "persona-constitution-mcp"
version = "3.6.0"
description = "MCP server serving the Agentic Engineering Persona constitution: SWEBOK v4.0, NASA Power of 10, Zero Framework Tolerance."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
# Verified by running the full test suite on CPython 3.9.6 and 3.14.6.
requires-python = ">=3.9"

# CodebaseCSI supplies the structural stub/mock detection behind
# scan_code_for_violations. It is not published on PyPI, so it is vendored at
# codebase_csi/ (provenance in codebase_csi/VENDORED.md) and the package has
# zero runtime dependencies.
dependencies = []
keywords = ["mcp", "model-context-protocol", "swebok", "power-of-10", "code-quality", "llm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.14",
  "Topic :: Software Development :: Quality Assurance",
]

[project.optional-dependencies]
# Pinned exactly: an unpinned linter turns an upstream release into a red build
# on a commit that changed nothing. Bump deliberately.
dev = ["ruff==0.16.3", "mypy==1.19.1", "mutmut==3.3.1", "pytest==8.4.2"]
# Optional tree-sitter tier for the vendored CodebaseCSI ASTParser. Without it
# the scanner still runs: Python uses the stdlib ast engine and other languages
# fall back to the constitution's structural regex rules.
#
# The pins are an ABI compatibility matrix, not a style choice. py-tree-sitter
# 0.23.x (the newest series installable on the 3.9 floor) accepts grammar ABI
# 13-14 and rejects 15 with "Incompatible Language version". Every pin below
# was verified to load and parse on CPython 3.9.6: rust 0.23.3+ and c 0.23.5+
# ship ABI 15 mid-series and are excluded by exact ceilings (verified
# empirically on a fresh resolve, not read from changelogs). php is
# deliberately absent - its wheel exports language_php() rather than
# language(), which the vendored loader treats as unavailable and routes to
# the regex fallback.
ast = [
  "tree-sitter>=0.23,<0.24",
  "tree-sitter-python>=0.23,<0.24",
  "tree-sitter-javascript>=0.23,<0.24",
  "tree-sitter-typescript>=0.23,<0.24",
  "tree-sitter-java>=0.23,<0.24",
  "tree-sitter-go>=0.23,<0.24",
  "tree-sitter-rust>=0.23,<0.23.3",
  "tree-sitter-ruby>=0.23,<0.24",
  "tree-sitter-c>=0.23,<0.23.5",
  "tree-sitter-cpp>=0.23,<0.24",
]

[project.urls]
Repository = "https://github.com/QuantmindSSI/CTO-MCP"

[project.scripts]
persona-constitution-mcp = "persona_constitution.server:main"
persona-pr-review = "persona_constitution.review.cli:main"

[tool.setuptools.packages.find]
# persona_constitution is the server; codebase_csi is the vendored detection
# dependency. Both must ship in the wheel or the installed server exits 1.
include = ["persona_constitution*", "codebase_csi*"]

[tool.setuptools.package-data]
# CONSTITUTION.md is not documentation - it is the payload this server exists to
# serve, and the server refuses to start without it. It must ship inside the
# wheel. Verified by installing into a clean venv and calling the console script.
persona_constitution = ["data/*.md"]
# The provenance ledger travels with the vendored code.
codebase_csi = ["VENDORED.md"]

[tool.mypy]
# Strict on the shipped package; the version is the requires-python floor so
# typing that only works on newer interpreters fails here, not at install.
#
# tests/ is deliberately outside this gate - a reviewed decision, not an
# omission. Measured (mypy 1.19.1, relaxed profile): 65 findings, of which
# 45 are implicit-reexport import hygiene and every remaining arg-type hit
# is a test deliberately passing garbage (scan_code(None),
# GitHubClient(None)) to verify rejection - which is the suite's job.
# Typing that away would mean casting adversarial inputs, weakening the
# very tests. Re-evaluate if the test helpers grow real API surface.
python_version = "3.9"
strict = true
files = ["persona_constitution"]
# Warn on anything strict doesn't already cover that we still care about.
warn_unreachable = true

[[tool.mypy.overrides]]
# Vendored third-party code, kept in upstream (untyped) style for clean
# syncs - the same boundary the lint regime draws. Its symbols enter the
# first-party modules as Any, which strict mode tolerates at call sites.
module = "codebase_csi.*"
ignore_missing_imports = true
follow_imports = "skip"

[tool.ruff]
# 3.9 is the floor declared in requires-python; lint against it so syntax that
# only parses on newer interpreters is caught here rather than at a user's install.
target-version = "py39"
line-length = 110
# codebase_csi is vendored third-party code kept in upstream style so future
# syncs stay a clean diff; it is deliberately outside this repo's lint regime.
extend-exclude = ["build", "dist", ".venv", "codebase_csi"]

[tool.ruff.lint]
select = [
  "E",    # pycodestyle errors
  "F",    # pyflakes: undefined names, unused imports
  "W",    # pycodestyle warnings
  "I",    # import sorting
  "B",    # bugbear: mutable defaults, silent except, loop-variable binding
  "BLE",  # blind except - the dispatcher's are deliberate and marked with noqa
  "UP",   # pyupgrade
  "C4",   # comprehension clarity
  "SIM",  # simplification
  "RET",  # return-path consistency
  "ARG",  # unused arguments
  "PTH",  # prefer pathlib
  "RUF",
]
ignore = [
  "E501",    # line length is enforced by the formatter, not the linter
  "SIM105",  # contextlib.suppress is not clearer than try/except/pass here
]

[tool.ruff.lint.per-file-ignores]
# Tests deliberately construct throwaway values and long literal fixtures.
"tests/*" = ["ARG002", "B011"]
# The benchmark corpus is intentionally full of stub code as test data.
"tools/benchmark_scanner.py" = ["ARG001", "ARG002"]

[tool.mutmut]
# Mutation testing of the detector core: the product IS these rules, so
# their tests must prove detection, not merely execution. Run nightly
# (mutation.yml), not per-PR - hundreds of mutants times the suite is a
# budget, not a gate. tests/conftest.py scopes out the tests that assert
# real-repository properties (release integrity, wall-clock budgets,
# subprocess transport), which are meaningless inside the mutants/ sandbox.
# Baseline measured at introduction: logic_rules.py 107/155 killed (69%).
paths_to_mutate = [
  "persona_constitution/dependencies.py",
  "persona_constitution/logic_rules.py",
  "persona_constitution/scanner.py",
  "persona_constitution/ast_bridge.py",
  "persona_constitution/review/diff.py",
  "persona_constitution/review/engine.py",
]
tests_dir = ["tests/"]
# The sandbox copies only Python sources by default; these are the data
# files the suite legitimately reads.
also_copy = [
  "CHANGELOG.md",
  "pyproject.toml",
  "tools/",
  "persona_constitution/data/",
  ".persona-review.json",
  # mutmut only materialises the mutated files of a package directory; the
  # unmutated siblings must ride along or the sandbox package is incomplete.
  "persona_constitution/review/__init__.py",
  "persona_constitution/review/cli.py",
  "persona_constitution/review/config.py",
  "persona_constitution/review/github_client.py",
  "persona_constitution/review/report.py",
]
